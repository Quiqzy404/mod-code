name: Build Fabric mod

on:
  push:
    paths-ignore:
      - 'runtime-classes/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod JAR
        run: ./gradlew build generateDynamicClassIndex --no-daemon
      - name: Publish compiled runtime classes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-classes/
          if ! git diff --cached --quiet; then
            git commit -m "Update compiled runtime classes"
            git push
          fi
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: modcode-fabric-1.21.11
          path: build/libs/modcode-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
