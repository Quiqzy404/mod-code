plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

}

tasks.register('compileDynamicClasses', JavaCompile) {
    source = fileTree('src/main/java') {
        include '**/*.java'
        exclude '**/ModCodeClient.java'
    }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = layout.projectDirectory.dir('runtime-classes').asFile
    options.release = 21
    options.encoding = 'UTF-8'
    doFirst {
        delete destinationDirectory.get().asFile
    }
}

tasks.register('generateDynamicClassIndex') {
    dependsOn tasks.named('compileDynamicClasses')
    doLast {
        def outputDir = layout.projectDirectory.dir('runtime-classes').asFile
        def classFiles = fileTree(outputDir) { include '**/*.class' }
                .files
                .collect { outputDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
                .sort()
        new File(outputDir, 'class-index.txt').text = classFiles.join('\n') + (classFiles ? '\n' : '')
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

